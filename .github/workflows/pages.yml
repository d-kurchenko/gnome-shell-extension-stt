name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'metadata.json'
      - 'locale/**/LC_MESSAGES/*.po'
      - 'assets/screenshots/**'
      - 'assets/branding/listing.png'
      - 'resources/icons/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'metadata.json'
      - 'locale/**/LC_MESSAGES/*.po'
      - 'assets/screenshots/**'
      - 'assets/branding/listing.png'
      - 'resources/icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
