name: Publish extension

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ego-publish
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" stt-ego-upload.zip --clobber

  upload:
    needs: release
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install GNOME extension tools
        run: dnf install -y --setopt=install_weak_deps=False gnome-shell

      - uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Submit to GNOME Extensions review
        shell: bash
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          : "${EGO_USERNAME:?Add the EGO_USERNAME repository secret}"
          : "${EGO_PASSWORD:?Add the EGO_PASSWORD repository secret}"
          printf '%s' "$EGO_PASSWORD" | gnome-extensions upload \
            --user="$EGO_USERNAME" \
            --password-file=- \
            --accept-tos \
            stt-ego-upload.zip
